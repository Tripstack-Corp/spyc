# Standalone spike crate. The empty `[workspace]` table makes this its own
# workspace root, so cargo never walks up into spyc's manifest and `make check`
# on main is untouched. Nothing here is published or linked into a binary.
[workspace]

[package]
name = "shell-attention-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
# The jar's own rustix, with its features: every observation the jar could make
# goes through it or `std`, so what compiles here is what the jar can call.
rustix = { version = "1.1.4", features = ["process", "fs", "termios", "pty", "event", "net", "stdio", "pipe"] }
# The probe's own bookkeeping (rows, output), never an observation.
serde_json = "1"
# A cross-check of rustix's `tcgetattr` against the C library's, and macOS's
# `libproc` calls, which rustix doesn't wrap. The jar forbids `unsafe`, so it
# would reach the macOS calls through the `libproc` crate instead (README).
libc = "0.2"

[profile.release]
debug = false
