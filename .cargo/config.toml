# Dependency cooldown (Cargo 1.100): when this checkout resolves a version
# not already in Cargo.lock (`cargo add`, `cargo update`, a new dependency),
# a release younger than this is passed over. A compromised release is
# usually caught and yanked within days; this keeps it out of the lockfile
# meanwhile. Dependabot keeps the same delay (.github/dependabot.yml).
# `cargo install` doesn't read it; `--locked` builds are unaffected.
[registry]
global-min-publish-age = "7 days"

# spyc's minimum macOS, for both slices (#1158). The vendored libghostty-vt
# archives are built for 13.0 (Zig's default), so the binary can't honestly
# claim less. Cargo sets this for every rustc run and build script from this
# checkout, `make`, CI and release builds alike: rustc stamps it on spyc's own
# objects and the binary, and `cc` compiles zstd-sys and mlua-sys for it
# rather than for the SDK's version. An exported MACOSX_DEPLOYMENT_TARGET takes
# precedence, and `cargo install spyc` from crates.io doesn't read this file.
[env]
MACOSX_DEPLOYMENT_TARGET = "13.0"
