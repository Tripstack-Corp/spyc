# A leaked credential fails the pull request that adds it.
#
# GitHub's own secret scanning and push protection are on, but on the free
# plan they know only partner token formats; the generic patterns (private
# keys, passwords, connection strings) are paid. TruffleHog's detectors cover
# those, and it tries each match against its service to tell a live key from a
# dead one.
#
# It scans only the commits a pull request adds, or a push to main adds, never
# the whole history: an old commit embeds a base64 video that one detector
# reads as a Box key. Every result fails the job, verified or not. A false
# positive is silenced on its own line with a `trufflehog:ignore` comment,
# never by narrowing the results.
#
# The action and the scanner image are pinned apart: the action's `version`
# input defaults to `latest`, which would run a new scanner unreviewed.
name: Secrets

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: Secrets (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan walks from the base commit to the head; both must be here.
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.7
        with:
          version: 3.99.7
          extra_args: --results=verified,unknown,unverified
