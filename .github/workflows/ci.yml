# spyc CI — fmt, clippy, tests, supply-chain (cargo-deny), coverage.
#
# Ported from the retired `bitbucket-pipelines.yml` (archived under
# docs/archive/). Same contract:
#   - PR                  → lint ∥ test
#   - push to main (merge)→ lint ∥ test ∥ coverage
#   - feature push, no PR → no CI (open the PR for feedback)
#
# Toolchain is pinned by `rust-toolchain.toml` (rustup auto-installs and
# selects it on the first cargo call, incl. the rustfmt/clippy components),
# so a new stable Rust release can't silently tighten lints. All cargo
# invocations use --locked (via the Makefile) so a Cargo.lock drift fails
# loudly. The C compiler on ubuntu-latest is load-bearing: spyc links
# compiled-C deps (zstd-sys/libzstd, mlua-sys/vendored Lua 5.4).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR/branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The per-crate incremental metadata embeds paths/timestamps that go stale
  # across runners and defeat warm-cache reuse; disabling it also shrinks the
  # cache. (Matched the Bitbucket pipeline.)
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Full backtrace on any panic so a CI-only failure is diagnosable from the
  # log alone. Aimed at the intermittent gix worktree index-lock flake
  # (`write index: Could not acquire lock`), which doesn't reproduce on macOS —
  # the next occurrence must show WHERE the lock acquisition unwinds.
  RUST_BACKTRACE: full

permissions:
  contents: read

jobs:
  lint:
    # This `name` is a REQUIRED STATUS CHECK context in main's branch protection.
    # Changing it is a three-step operation, not an edit: drop the old context
    # from protection, merge the rename, then add the new one. A rename on its own
    # deadlocks every open PR — the old required context never reports again, so
    # the merge button can never go green.
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain + C compiler (load-bearing for *-sys crates)
        run: rustc --version && cargo --version && cc --version
      - uses: Swatinem/rust-cache@v2
      # fmt-check + clippy. Tests run in the parallel `test` job; supply-chain
      # (cargo-deny) runs in `audit.yml` — it re-fetches the RUSTSEC DB over the
      # network on every invocation, which has segfaulted mid-run here and failed
      # a PR that touched no dependencies.
      - run: make fmt-check lint

      # Workflow linting rides in THIS job because `Lint (fmt, clippy)` is
      # already a required status check. A separate job would need adding to
      # branch protection as a second operation, and until that happened a
      # broken workflow could still merge — which is the exact gap this closes.
      # The job name is left alone: renaming a required context deadlocks every
      # open PR (see the note on this job's `name`).
      #
      # Pinned + checksum-verified rather than floating, same as cargo-llvm-cov
      # in `coverage`. shellcheck ships on the ubuntu-latest image; it is
      # verified present because actionlint SILENTLY skips every `run:` block
      # and exits 0 without it, so an image change would otherwise turn this
      # step into a no-op that still reports green.
      - name: Lint workflows (actionlint + shellcheck)
        run: |
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSLo /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint "$HOME/.cargo/bin/actionlint"
          make lint-workflows

  test:
    name: Tests (cargo test --all-targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain + C compiler
        run: rustc --version && cc --version
      - uses: Swatinem/rust-cache@v2
      # line-tables-only DWARF keeps panic file:line for failures while
      # trimming the test compile + shrinking the cache. CI-only override.
      - name: Tests
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: make test

  coverage:
    name: Coverage (ratcheting floor)
    # MAIN-ONLY: a third full (instrumented) compile. Keeping it off the PR
    # path lets a PR finish in max(lint, test); the --fail-under-lines ratchet
    # then gates the merged result on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov (pinned, sha256-verified)
        run: |
          CARGO_LLVM_COV_VERSION=0.8.7
          CARGO_LLVM_COV_SHA256=967b5cc996c29d8baa52bbb4595ef1f53af35255af8e2036ddbc6468d7b523c7
          if ! { cargo-llvm-cov --version 2>/dev/null || cargo-llvm-cov llvm-cov --version 2>/dev/null; } | grep -q "${CARGO_LLVM_COV_VERSION}"; then
            curl -sSLo /tmp/cargo-llvm-cov.tar.gz "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
            echo "${CARGO_LLVM_COV_SHA256}  /tmp/cargo-llvm-cov.tar.gz" | sha256sum -c -
            tar -xzf /tmp/cargo-llvm-cov.tar.gz -C /tmp
            install -m 0755 /tmp/cargo-llvm-cov "$HOME/.cargo/bin/cargo-llvm-cov"
          fi
      # target-cov keeps the instrumented build out of the test job's cache.
      - name: Coverage (fail under 35% lines)
        env:
          CARGO_TARGET_DIR: target-cov
        run: cargo llvm-cov --locked --all-targets --fail-under-lines 35
