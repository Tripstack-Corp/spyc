# spyc is the workspace root now that `crates/spyc-vt-sys` exists. The FFI to
# libghostty-vt lives in its own crate so the whole `unsafe` surface, the pinned
# ghostty commit and the vendored static archives have one home — the decisions
# log's standing scope for unsafe ("exceptional and isolated (a future crate
# split would give it a dedicated crate)").
#
# `spikes/` and `fuzz/` each declare their own `[workspace]`, so they are
# separate workspace roots and not members here. They are listed in `exclude`
# anyway: relying on a nested manifest to opt itself out is invisible from this
# file, and a nested crate that forgets its own `[workspace]` would silently
# join the gate.
[workspace]
members = [".", "crates/spyc-vt-sys"]
exclude = ["fuzz", "spikes/vt-engine", "spikes/vt-engine/sizeprobe"]

[package]
name = "spyc"
version = "2.2.0-CURRENT"
edition = "2024"
description = "A Rust TUI file commander where the AI agent in the side pane can query the file commander itself"
license = "BSD-3-Clause"
repository = "https://github.com/Tripstack-Corp/spyc"
rust-version = "1.88"
readme = "README.md"
keywords = ["tui", "file-manager", "terminal", "mcp", "agent"]
categories = ["command-line-utilities", "filesystem"]
# Trim the published crate to what's needed to build + a README: keep `src/`
# (incl. the `include_str!`'d `src/config/default.spycrc.toml`), Cargo.{toml,lock},
# README, LICENSE, CHANGELOG. Drop the dev/CI/media bulk (`docs/` alone is ~5 MB
# of assets + archives) so `cargo package` stays small and `cargo install` fast.
exclude = [
    # `/docs` as a whole is not shipped, but `docs/ABOUT.md` is compiled INTO the
    # binary (`src/app/about.rs` include_str!s it), so excluding it makes the
    # published crate fail to build. That is invisible until `cargo publish`
    # runs, which only happens on a tag — it broke the v2.1.0 release.
    # Guarded by `about_md_is_packaged`.
    "/docs/**",
    "!/docs/ABOUT.md",
    "/.github",
    "/.aislop",
    "/fuzz",
    "/tests",
    "/assets",
    "/Makefile",
    "/cliff.toml",
    "/deny.toml",
    "/.gitattributes",
]

[[bin]]
name = "spyc"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
# Mermaid-in-pager (docs/archive/MERMAID_PAGER_PLAN.md): render ```mermaid blocks as
# terminal-graphics images. All pure-Rust, zero C deps — `default-features =
# false` on ratatui-image drops the `chafa-dyn` default (a C lib via
# pkg-config); Sixel still works via pure-Rust `icy_sixel`, and Kitty/iTerm2/
# halfblocks are built in. ratatui-image tracks ratatui 0.30; mermaid-rs-renderer
# emits PNG via resvg (no Node/Chromium); `image` decodes it.
#
# `image`'s formats are the set spyc can PREVIEW, not just what mermaid emits:
# jpeg/gif/webp are what a screenshot or an agent-pasted attachment actually
# arrives as (the Claude transcript carries image/png and image/jpeg). All four
# decoders are pure-Rust.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
mermaid-rs-renderer = { version = "0.3", default-features = false, features = ["png"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Rasterize the mermaid SVG → PNG (pure-Rust; same version mermaid-rs-renderer
# pulls in, so no duplicate in the tree). We drive it directly to control the
# white background + system-font loading.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
# base64 for the image-pager `b` verb (PNG → base64 text buffer). Already in the
# tree transitively; making it direct.
base64 = "0.23"
# Image clipboard for the image-pager `y` verb — no portable shell helper for
# images (text clipboard stays shell-based in src/clipboard.rs). macOS works
# cleanly; Linux is best-effort (X11/Wayland clipboards don't persist after exit
# without a manager).
arboard = "3"
# Desktop notifications for agent status changes (src/notifications.rs, the
# P3-1 "which agent needs me" ping). `default-features = false` + `z` keeps the
# Linux backend pure-Rust (zbus + async-io, no C libdbus → static musl stays
# clean) and drops the unused async/serde defaults; macOS uses
# mac-notification-sys, Windows winrt. NOTE: notifies the machine spyc RUNS on —
# over SSH that's the remote, not the client (documented in the [notify] config).
notify-rust = { version = "4", default-features = false, features = ["z"] }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
glob = "0.3"
# `~` / `$VAR` / `${VAR}` expansion for jump targets (src/paths.rs). Pure-Rust.
# `default-features = false` with only `base-0` is load-bearing, not tidiness:
# the default `tilde` feature exists to auto-detect HOME via the `dirs` crate,
# which spyc must not use — HOME comes from the `envset` overlay (`:setenv`), so
# we pass our own home + var lookup to `full_with_context_no_errors`. Trimmed
# this way the crate has ZERO dependencies of its own.
shellexpand = { version = "3", default-features = false, features = ["base-0"] }
# POSIX shell word quoting for `%` expansion and the hook/pager command strings
# spyc builds for `sh -c` (src/shell/expand.rs). Pure-Rust, zero dependencies.
# Quoting user-selected paths into a shell command is the one place where "small
# and correct today" still argues for the widely-deployed implementation over
# our own, so `shell_quote` routes through `shlex::try_quote`.
shlex = { version = "2", default-features = false, features = ["std"] }
# In-process three-way text merge for the `spyc --merge-driver` git merge
# driver (src/merge_driver.rs). Pure-Rust, tiny — lets us resolve the
# version-line Cargo.toml/Cargo.lock conflicts without shelling out to `git`
# (the no_subprocess_git_in_production guard) or reimplementing diff3.
diffy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
portable-pty = "0.9"
spyc-vt-sys = { path = "crates/spyc-vt-sys" }
vt100 = "0.16"
ansi-to-tui = "8"
pretty-hex = "0.4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"
# Grapheme-cluster segmentation. `unicode-width` scores a cluster (e.g. a
# base char + U+FE0F) wider than the sum of its chars, so anything that
# measures text incrementally has to advance by cluster to agree with it.
unicode-segmentation = "1"
# Cluster-safe truncation for the `src/ui` width helpers (`display_truncate`
# and `_tail`, `truncate_middle`), which used to walk `char_indices()` and sum
# per-char widths — measuring "❤️" (U+2764 U+FE0F) as 1 column where the
# terminal draws 2, and a ZWJ emoji as 6 where it draws 2, while being free to
# slice either in half. Not a new dependency at all: `ratatui-core` already
# pulls it in for ratatui's own truncation, so this only promotes it to direct
# (zero new crates, zero binary-size cost).
unicode-truncate = { version = "2", default-features = false, features = ["std"] }
libc = "0.2"
ignore = "0.4"
# Git plumbing — the gitoxide crate. Pure-Rust (zlib-rs is the default
# compression backend now; no C, no `*-sys`, so static musl builds stay
# clean). Replaces the `git` subprocess shell-outs behind the `src/git/`
# facade, one domain at a time. `default-features = false` + a trimmed set
# (status / diff / blame / discovery, plus `parallel` for the
# multi-threaded status walk that keeps huge-tree refreshes cheap);
# networking, credentials, worktree archive/stream, progress reporting,
# and ~40 other default features stay off. `worktree-mutation` is on for
# the hand-rolled worktree create/remove (gix-worktree-state checkout).
gix = { version = "0.87", default-features = false, features = [
    "sha1",
    "status",
    "dirwalk",
    "blame",
    "blob-diff",
    "revision",
    "index",
    "attributes",
    "excludes",
    "parallel",
    "worktree-mutation",
] }
nucleo-matcher = "0.3"
grep-searcher = "0.1"
grep-regex = "0.1"
open = "5"
regex = "1"
grep-matcher = "0.1"
jiff = "0.2"
uuid = { version = "1", features = ["v7"] }
uzers = "0.12"
strip-ansi-escapes = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
tar = "0.4"
zstd = "0.13"
# Archive browsing (docs/archive/ARCHIVE_BROWSING_PLAN.md): read the zip central
# directory to index a mount without decompressing, and `raw_copy_file` untouched
# entries on repack. `default-features = false` is required, not tidiness — the
# 14-feature default set pulls a C `bzip2` binding plus lzma/xz/ppmd/zopfli/aes.
# We take deflate through the `zlib-rs` already in the tree (gix) and zstd
# through the crate above, so no new compiled-C dependency enters the build.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "zstd",
] }
# gzip streaming for `.tar.gz` mounts, on the same `zlib-rs` backend as `zip`'s
# deflate (already in the tree) rather than pulling a second inflate impl.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
trash = "5"
# tempfile is a runtime dep (not just dev-deps) because the
# graveyard's cascade-to-trash and legacy-migration paths stage
# files into a TempDir before handing them to the system trash.
tempfile = "3"
rustix = { version = "1.1.4", features = ["process", "termios", "fs", "system"] }
# Portable process stats (RSS / thread count) for the activity HUD — OS
# APIs via a safe wrapper instead of shelling out to `ps` (whose `thcount`
# keyword isn't portable). Trimmed to the `system` feature only (no
# disk/network/component/user backends). Aliased because spyc has an
# internal `crate::sysinfo` module.
sysinfo_crate = { package = "sysinfo", version = "0.33", default-features = false, features = ["system"] }
infer = { version = "0.22.0", default-features = false }
# Lua scripting engine (docs/archive/LUA_SCRIPTING_PLAN.md): embeds Lua 5.4 so a
# `~/.config/spyc/init.lua` / keybinding can run user logic. `vendored` compiles
# the Lua 5.4 C source via the `cc` crate — another compiled-C dependency
# alongside `zstd-sys` (libzstd), so it rides the same toolchain: native builds
# use the host/image C compiler, and the musl/darwin cross-builds route it
# through `cargo zigbuild`'s `zig cc` like every other `*-sys` crate. No `send`
# feature — the interpreter is pinned to a single worker thread.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# `strum::EnumIter` on the `Action` enum lets the `action_names_round_trip`
# guard test iterate every variant, so a new action that isn't wired into
# `canonical_name` / `action_from_name` fails the build (the completeness
# guarantee behind Lua's `spyc.action(name)`). Already in the tree transitively,
# so no new download / `cargo deny` concern; `derive` is the only feature we use.
strum = { version = "0.28", features = ["derive"] }

# macOS thread count: sysinfo's `tasks()` is Linux-only, so on macOS we read
# it from `proc_pidinfo(PROC_PIDTASKINFO).pti_threadnum` via the small,
# safe-wrapper `libproc` crate (no `unsafe` in our code; one kernel call, no
# manual thread-array alloc/dealloc). macOS-only target dep.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
insta = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# `unwind` instead of `abort` so `std::panic::catch_unwind` actually
# catches panics — `pane::parser_worker` wraps every `process()` call in
# one and rebuilds a torn parser, so one bad byte stream costs a blank
# grid instead of the whole process and every other pane with it.
#
# This comment used to give the reason as vt100's DECRC-after-resize
# panic (nvim leaving the alternate screen). **That one was fixed
# upstream in 0.16.2, which we ship** — so the stated reason had
# expired while the net stayed load-bearing, which is an invitation to
# delete a net that is still catching things. What it actually catches
# on 0.16.2, measured by the spike's `vt100_panics` probe over the open
# upstream reports (see `docs/drafts/VT_ENGINE_SPIKE.md` §5):
#
#   * a wrap on a 1-row screen                 (issue #37)
#   * a double-width char on a 1-column screen (issue #37)
#   * a wide char split by a shrink, then written  (#37 / #28)
#   * the same setup, then erased                  (#28)
#
# All four are reachable: `Pane::resize` and `pane_spawn_size` clamp
# both dimensions with `.max(1)`, which lands exactly on the 1-row and
# 1-column cases. Structured-random escape streams panic vt100 on 2.87%
# of iterations. We are not carrying patches for these and not adding a
# geometry floor — the engine swap lands this release (V2_2_PLAN.md §8),
# and patching a parser we are leaving would make spyc its fork.
#
# When the engine flips, this list stops being the reason but the
# setting stays: `catch_unwind` around any terminal state machine's
# byte processing is cheap insurance against a parser bug in untrusted
# input, and the alternative is `abort`. Retiring it is not part of
# removing vt100.
panic = "unwind"

[profile.release-static]
inherits = "release"

# release-debug: same optimized release, but keep debug symbols so
# `sample`, `lldb`, `perf`, and dSYM-based profilers can resolve
# Rust function names. Built via `make release-debug` /
# `make install-debug` and installed as `spyc.debug` (alongside
# the stripped production `spyc`), so users can switch when they
# need to dig into a slow long-running session.
[profile.release-debug]
inherits = "release"
strip = "none"
debug = "full"
split-debuginfo = "packed"

# Clippy lint configuration.
#
# We opt into `pedantic` and `nursery` to learn more idiomatic patterns, but
# mute a small set of lints that are famously noisy or subjective for a
# binary crate (as opposed to a published library). Each allow has a reason;
# remove a line if you want to hear that voice again.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Short/long types with the module name baked in are fine; this lint flags
# things like `fs::FsError` which we deliberately don't have.
module_name_repetitions = "allow"

# Binary crate — we don't need /// # Errors on every function returning Result.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Too noisy for a UI-heavy codebase full of u16/usize conversions between
# terminal geometry and list indices.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

# We rarely need to mark public items #[must_use]; not useful here.
must_use_candidate = "allow"

# We intentionally use `if let Some(x) = y { ... } else { ... }` chains for
# readability; this lint wants us to collapse to `match`.
option_if_let_else = "allow"

# Dispatch functions (handle_prompt_key, App::apply) are naturally long —
# one match arm per supported action. Splitting them hurts navigation.
too_many_lines = "allow"

# "missing backticks in doc" is too eager — it flags things like trailing
# periods after identifiers and is frequently wrong.
doc_markdown = "allow"

# `branches_sharing_code` is overly aggressive about "same last statement"
# suggestions.
branches_sharing_code = "allow"

# Pedantic style lints we don't enforce — they're code-shape opinions, not
# correctness. Each line notes the lint and why we skip it.

# `use` near the point of use reads better than at the top of a long fn.
items_after_statements = "allow"

# JSON-RPC helpers take `Value` by value; that's the idiomatic shape even
# when a particular arm doesn't consume the whole thing.
needless_pass_by_value = "allow"

# Short locals like `new_bps` / `new_sp` in tight windows are fine; moving
# to verbose names hurts readability more than the lint helps.
similar_names = "allow"

# The CLI struct is clap-derived and has 4 bool flags. Fine.
struct_excessive_bools = "allow"

# Public methods that take `&self` for API consistency (future-proofing
# when other struct state is needed) — don't strip it just because the
# current body doesn't touch any fields.
unused_self = "allow"

# Nursery lint that hits every path manipulation against an integration
# boundary — a tuple/slice of (Path, fallback) would be strictly worse.
or_fun_call = "allow"
