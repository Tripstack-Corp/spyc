[package]
name = "spyc-jar"
version = "0.0.0"
edition = "2024"
publish = false
description = "Stage 2 spike: a process that holds one pane's program and its PTY, and outlives spyc"
license = "BSD-3-Clause"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spyc-jar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rustix = { version = "1.1.4", features = ["process", "fs", "termios", "pty", "event", "net", "stdio", "pipe"] }

# R26 and the program role on macOS: rustix reads a unix socket's peer
# (its user and pid) only on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
tempfile = "3"
# The measurement example compares a jar with a PTY spyc opens directly.
portable-pty = "0.9"
rustix = { version = "1.1.4", features = ["process"] }
