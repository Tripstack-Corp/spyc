[package]
name = "spyc-jar"
version = "0.0.0"
edition = "2024"
publish = false
description = "Stage 2 spike: a process that holds one pane's program and its PTY, and outlives spyc"
license = "BSD-3-Clause"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spyc-jar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# R19 on macOS: an upgrade's state is sealed before it touches a file.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rustix = { version = "1.1.4", features = ["process", "fs", "termios", "pty", "event", "net", "stdio"] }

[dev-dependencies]
tempfile = "3"
# The measurement example compares a jar with a PTY spyc opens directly.
portable-pty = "0.9"
rustix = { version = "1.1.4", features = ["process"] }
